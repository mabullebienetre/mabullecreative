": ["images/photo-043.jpg"], "image": "images/photo-043.jpg"}, {"id": "1790959065020", "title": "Otto part au Mexique et fête El dia de los muertos", "price": 2.5, "description": "Accompagne Otto dans un voyage au Mexique, où il découvre la magnifique fête traditionnelle El Día de los Muertos.\nEntre guirlandes colorées, squelettes rigolos, fleurs de cempasúchil et sucreries en forme de crânes, les enfants apprendront qu’il s’agit d’une fête joyeuse pour se souvenir des personnes qu’on aime.\n\n👉 Ce kamishibaï est idéal pour :\n\nAborder la diversité culturelle avec les enfants\n\nIntroduire des notions de mémoire et de transmission familiale\n\nPartager un moment d’émotion, de couleurs et de joie\n\n📚 Contenu : 10 planches illustrées en format paysage, prêtes à imprimer et à raconter aux enfants.\n", "driveLink": "https://drive.google.com/file/d/1i4Oq9WuCJDNiZsPndhKwWr2okPGAk_d4/view?usp=share_link", "revolutLink": "", "images": ["images/photo-044.jpg"], "image": "images/photo-044.jpg"}, {"id": "1790958915701", "title": "Les trésors d'Otto en Automne", "price": 2.5, "description": "Plongez dans l’univers chaleureux d’Otto la loutre avec ce kamishibaï de 12 planches illustrées, spécialement conçu pour les enfants de maternelle et du cycle 1.\n\nDans cette histoire, Otto part à la découverte des trésors de l’automne : feuilles colorées, glands, marrons, champignons et plumes… Chaque planche invite les enfants à observer, nommer, décrire et s’émerveiller devant les richesses de la saison.", "driveLink": "https://drive.google.com/file/d/1TujN18kxZRrBdV7Wi5NLDWcvm0-MX88E/view?usp=share_link", "revolutLink": "", "images": ["images/photo-045.jpg"], "image": "images/photo-045.jpg"}, {"id": "1790944950764", "title": "Otto et la citrouille qui avait peur du noir", "price": 2.5, "description": "À l'approche d'Halloween, Otto rencontre Lulu, une petite citrouille qui tremble de peur à l'idée de se retrouver dans le noir. Avec douceur et bienveillance, Otto l'aide à mettre des mots sur sa peur, à respirer et à découvrir que la nuit peut aussi être un univers merveilleux.\n\nAu fil de l'histoire, les enfants découvrent une petite technique de respiration ludique :la respiration de la citrouille magique. Ils sont invités à gonfler leur ventre comme une citrouille, puis à souffler doucement comme pour faire briller une bougie.\n\nL'histoire permet également d'aborder les émotions, l'empathie, la confiance en soi et la transformation des peurs, notamment grâce au jeu autour des ombres et à l'idée d'une « lumière intérieure ».", "driveLink": "https://drive.google.com/file/d/1t9Iqc_zivjO_aLwQngYDwsifdjFumMkF/view?usp=share_link", "revolutLink": "", "images": ["images/photo-046.jpg"], "image": "images/photo-046.jpg"}, {"id": "1790944698841", "title": "Otto fête Halloween", "price": 2.5, "description": "Découvrez l’histoire d’Otto, la petite loutre malicieuse, qui part à l’aventure le soir d’Halloween. Déguisé en sorcier, il rencontre une chauve-souris, un fantôme rigolo et des enfants costumés avant de partager une fête pleine de rires et de friandises.\n\nCe kamishibaï coloré et rassurant est idéal pour les jeunes enfants (2 à 6 ans). Illustré de belles images vives au format A4 paysage, il se glisse parfaitement dans un théâtre de bois.\n\n✨ Contenu du fichier :\n\n1 page de garde festive avec le titre “Otto fête Halloween”\n\n8 planches illustrées en couleurs vives (A4 paysage, sans texte)\n\nLe texte conteur correspondant, à imprimer au verso ou à garder en support de lecture\n\n🎯 Objectifs pédagogiques :\n\nStimuler l’imagination et le langage\n\nDécouvrir les traditions d’Halloween en douceur\n\nFavoriser l’écoute et le partage.", "driveLink": "https://drive.google.com/file/d/14To-POukYrY5qS3ayzAChcY_MpWyF2rU/view?usp=share_link", "revolutLink": "", "images": ["images/photo-047.jpg"], "image": "images/photo-047.jpg"}, {"id": "2113637981", "title": "Otto fe te son anniversaire", "price": 2.5, "description": "Otto fe te son anniversaire - Format kamishibai A3, 8-12 planches, PDF à imprimer. Téléchargement immédiat.", "driveLink": "", "revolutLink": "", "images": ["images/photo-048.png"], "image": "images/photo-048.png"}, {"id": "2743312156", "title": "Otto va au cirque", "price": 2.5, "description": "Otto va au cirque - Format kamishibai A3, 8-12 planches, PDF à imprimer. Téléchargement immédiat.", "driveLink": "", "revolutLink": "", "images": ["images/photo-049.png"], "image": "images/photo-049.png"}, {"id": "1073771962", "title": "Otto va au marche de Noel", "price": 2.5, "description": "Otto va au marche de Noel - Format kamishibai A3, 8-12 planches, PDF à imprimer. Téléchargement immédiat.", "driveLink": "", "revolutLink": "", "images": ["images/photo-050.png"], "image": "images/photo-050.png"}, {"id": "1149185420", "title": "Otto va a la cre che", "price": 2.5, "description": "Otto va a la cre che - Format kamishibai A3, 8-12 planches, PDF à imprimer. Téléchargement immédiat.", "driveLink": "", "revolutLink": "", "images": ["images/photo-051.jpg"], "image": "images/photo-051.jpg"}];
  const FB_LINK = "https://www.facebook.com/share/1KFNae1WnR/?mibextid=wwXIfr";

    // Charge les 47 kamishibai seulement si aucun stockage n'existe - respecte les modifications utilisateur
  console.log('Vérification catalogue 47 kamishibai');
  try{
    const existing = localStorage.getItem('ma_bulle_products');
    if(!existing || existing.length < 100){
      localStorage.setItem('ma_bulle_products', JSON.stringify(FINAL_PRODUCTS));
      console.log('Catalogue 47 initialisé');
    } else {
      try{
        const parsed = JSON.parse(existing);
        if(Array.isArray(parsed) && parsed.length < 10){
          localStorage.setItem('ma_bulle_products', JSON.stringify(FINAL_PRODUCTS));
        } else {
          console.log('Catalogue utilisateur conservé:', parsed.length);
        }
      }catch(e){}
    }
  }catch(e){
    console.error('Erreur check products', e);
  }

  // Bloque mailto
  const origOpen = window.open;
  window.open = function(url, ...rest){
    if(typeof url === 'string' && url.startsWith('mailto:')){
      setTimeout(()=> window.MB_sendRealOrder(), 300);
      return { closed:false, focus:()=>{}, close:()=>{} };
    }
    return origOpen.call(window, url, ...rest);
  };
  document.addEventListener('click', function(e){
    const a = e.target.closest('a');
    if(a && a.href && a.href.startsWith('mailto:')){ e.preventDefault(); e.stopPropagation(); setTimeout(()=> window.MB_sendRealOrder(), 300); return false; }
  }, true);

  window.MB_lastOrder = null;

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    const txt = (btn.textContent||'').toLowerCase();
    if(txt.includes('valider') && txt.includes('payer')){
      setTimeout(()=>{
        try{
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            try{
              const v = JSON.parse(localStorage.getItem(k));
              if(v && v.prenom && v.total) window.MB_lastOrder = v;
              if(Array.isArray(v) && v.length>0 && v[v.length-1]?.prenom) window.MB_lastOrder = v[v.length-1];
            }catch(e){}
          }
        }catch(e){}
      }, 600);
    }
  }, true);

  window.MB_sendRealOrder = function(){
    try{
      let order = null;
      // 1. PRIORITÉ : la dernière commande complète sauvegardée par Qf
      try{
        const rawFull = localStorage.getItem('mb_last_full_order');
        if(rawFull){
          const parsed = JSON.parse(rawFull);
          if(parsed && parsed.email && parsed.nom){
            order = parsed;
          }
        }
      }catch(e){}
      
      // 2. Sinon MB_lastOrder si complet
      if(!order || !order.email || order.email.includes('non renseigné')){
        if(window.MB_lastOrder && window.MB_lastOrder.email && window.MB_lastOrder.nom){
          order = window.MB_lastOrder;
        }
      }
      
      // 3. Sinon cherche dans ma_bulle_orders la dernière COMPLÈTE (avec email, nom, adresse et items)
      if(!order || !order.email || order.email.includes('non renseigné') || !order.items || order.items.length===0){
        try{
          const raw = localStorage.getItem('ma_bulle_orders');
          if(raw){
            const arr = JSON.parse(raw);
            if(Array.isArray(arr) && arr.length>0){
              // Trouve la première commande qui a tout
              for(let o of arr){
                if(o.email && o.nom && o.prenom && o.adresse && o.items && o.items.length>0 && !o.email.includes('non renseigné')){
                  order = o;
                  break;
                }
              }
              // Si aucune complète, prend la plus récente quand même
              if(!order) order = arr[0];
            }
          }
        }catch(e){ console.warn('read orders failed', e); }
      }

      if(!order){
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          try{
            const v = JSON.parse(localStorage.getItem(k));
            if(v && v.id && v.prenom && v.nom && v.email && v.adresse && !v.email.includes('non renseigné')){ order = v; break; }
            if(Array.isArray(v) && v.length>0){
              for(let it of v){
                if(it.email && it.nom && it.adresse && it.items && it.items.length>0){ order = it; break; }
              }
              if(order) break;
            }
          }catch(e){}
        }
      }
      if(!order || !order.email || order.email.includes('non renseigné')){
        alert('Oups ! Je ne trouve pas les coordonnées. Recommence la commande stp : remplis bien nom, prénom, adresse, email puis clique Valider et Payer, puis le lien Revolut.');
        return;
      }
      const totalQty = order.items && order.items.length>0 ? order.items.reduce((s,i)=> s+(i.qty||1),0) : '?';
      const detail = order.items && order.items.length>0 ? order.items.map(i=> (i.qty||1)+'x '+(i.product?.title||i.title||'kamishibai')).join('\n') : 'Detail admin';
      const driveLinks = order.driveLinks && order.driveLinks.length>0 ? order.driveLinks.join('\n') : (order.items?.map(i=>i.product?.driveLink).filter(Boolean).join('\n')||'Voir admin Commandes');
      const body = '💰 NOUVELLE COMMANDE - VERIFIE REVOLUT !\n\nCommande: '+order.id+'\nDate: '+new Date(order.date).toLocaleString('fr-FR')+'\n\n--- CLIENT (FACTURATION = LICENCE) ---\nNom: '+order.nom+'\nPrenom: '+order.prenom+'\nEmail: '+order.email+'\nAdresse complete: '+order.adresse+'\n\n--- COMMANDE ---\nQuantite: '+totalQty+' kamishibai\n'+detail+'\n\nTotal: '+order.total+'€\nLien Revolut utilise: '+(order.revolutLink||'')+'\n\n--- LIENS DRIVE ---\n'+driveLinks+'\n\n--- RAPPEL ---\nLicence liee a: '+order.prenom+' '+order.nom+' - '+order.adresse+' - '+order.email;
      const form = document.createElement('form');
      form.method='POST'; form.action='https://api.web3forms.com/submit'; form.style.display='none'; form.target='hidden_iframe_web3';
      const add = (n,v)=>{ const i=document.createElement('input'); i.type='hidden'; i.name=n; i.value=v; form.appendChild(i); };
      add('access_key', WEB3_KEY);
      add('subject', '💰 COMMANDE '+order.id+' - '+order.prenom+' '+order.nom+' - '+order.total+'€ - '+order.email);
      add('from_name', 'Ma Bulle Creative - Nouvelle commande');
      add('to', OWNER_EMAIL); 
      add('email', OWNER_EMAIL); 
      add('message', body); 
      add('replyto', order.email||OWNER_EMAIL);
      add('Nom', order.nom);
      add('Prenom', order.prenom);
      add('Email_Client', order.email);
      add('Adresse', order.adresse);
      add('Commande_ID', order.id);
      add('Total', order.total+'€');
      add('Quantite', totalQty);
      add('Drive_Links', driveLinks);
      let iframe = document.getElementById('hidden_iframe_web3');
      if(!iframe){ iframe=document.createElement('iframe'); iframe.name='hidden_iframe_web3'; iframe.id='hidden_iframe_web3'; iframe.style.display='none'; document.body.appendChild(iframe); }
      document.body.appendChild(form); form.submit(); setTimeout(()=> form.remove(), 2000);
      const msg = document.createElement('div');
      msg.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#2E7D32;color:white;padding:22px 32px;border-radius:16px;z-index:9999999;font-weight:bold;text-align:center;max-width:90vw;';
      msg.innerHTML = '✅ Commande envoyée !<br><span style="font-size:13px;font-weight:normal">'+order.prenom+' '+order.nom+'<br>'+order.email+'<br>Mail avec coordonnées envoyé, vérifie Revolut</span>';
      document.body.appendChild(msg); setTimeout(()=> msg.remove(), 6000);
    }catch(e){ console.error('MB_sendRealOrder error', e); alert('Erreur envoi: '+e.message); }
  };

    

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button') || e.target.closest('a');
    if(!btn) return;
    const txt = (btn.textContent||'').toLowerCase();
    const href = btn.href||'';
    if((txt.includes('payer') && txt.includes('revolut')) || href.includes('revolut.com')){
      setTimeout(()=> window.MB_sendRealOrder(), 400);
    }
  }, true);

  // Nettoie le cache au chargement et recharge pour forcer les 47
  window.addEventListener('load', function(){
    setTimeout(()=>{
      console.log('Produits forcés:', FINAL_PRODUCTS.length);
      // Si la page n'affiche pas 47, on force un reload une fois
      if(!sessionStorage.getItem('forced47')){
        sessionStorage.setItem('forced47','1');
        // Ne recharge pas en boucle
      }
    }, 1000);
  });

  setInterval(()=>{
    document.querySelectorAll('a').forEach(a=>{ if((a.textContent||'').includes('Facebook')){ a.href=FB_LINK; a.target="_blank"; } });
  }, 1000);
})();
</script>
